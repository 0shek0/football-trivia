# The game server. Vercel can't host it, because it needs an always-on process for
# live connections and battle timers. See docs/DEPLOY.md.
services:
  - type: web
    name: trivia-battle-server
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build -w @tb/server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
